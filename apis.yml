description: >-
  Software (software.com) is the developer-productivity company behind the Code
  Time and Music Time editor plugins, now rebranded and operating as Antenna
  (antenna.dev). Antenna is an AI-native development intelligence platform — a
  control plane for AI-driven software development that measures AI-tool
  adoption, engineering productivity shifts, and financial ROI across an
  engineering organization. It integrates with AI coding assistants (Claude
  Code, GitHub Copilot, Cursor, Codex, Gemini Code Assist, Windsurf, Amazon Q
  Developer, Kiro, Augment Code), Git providers (GitHub, GitLab, Bitbucket,
  Azure DevOps), Jira, Slack and Microsoft Teams, and exposes a hosted Model
  Context Protocol (MCP) server so AI agents can query engineering metrics in
  natural language. Backed by 8vc; reports serving 900K+ developers across 10K+
  companies.
